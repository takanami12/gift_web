<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-label="Giỏ tre">
  <defs>
    <pattern id="bambooWeave" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#3b1d09"/>
      <rect x="0" y="2" width="11" height="9" rx="1.5" fill="#c2811f"/>
      <rect x="0" y="2" width="11" height="2" fill="#fde68a" opacity="0.42"/>
      <rect x="0" y="9" width="11" height="2" fill="#7a4a04" opacity="0.6"/>
      <rect x="0" y="2" width="1.4" height="9" fill="#5d3a04" opacity="0.4"/>
      <rect x="9.6" y="2" width="1.4" height="9" fill="#5d3a04" opacity="0.4"/>
      <rect x="13" y="0" width="9" height="11" rx="1.5" fill="#a76b1a"/>
      <rect x="13" y="0" width="2" height="11" fill="#fde68a" opacity="0.4"/>
      <rect x="20" y="0" width="2" height="11" fill="#5d3a04" opacity="0.55"/>
      <rect x="13" y="0" width="9" height="1.4" fill="#fde68a" opacity="0.3"/>
      <rect x="13" y="9.6" width="9" height="1.4" fill="#5d3a04" opacity="0.45"/>
      <rect x="0" y="13" width="9" height="11" rx="1.5" fill="#a76b1a"/>
      <rect x="0" y="13" width="2" height="11" fill="#fde68a" opacity="0.4"/>
      <rect x="7" y="13" width="2" height="11" fill="#5d3a04" opacity="0.55"/>
      <rect x="0" y="13" width="9" height="1.4" fill="#fde68a" opacity="0.3"/>
      <rect x="0" y="22.6" width="9" height="1.4" fill="#5d3a04" opacity="0.45"/>
      <rect x="11" y="15" width="11" height="9" rx="1.5" fill="#c2811f"/>
      <rect x="11" y="15" width="11" height="2" fill="#fde68a" opacity="0.42"/>
      <rect x="11" y="22" width="11" height="2" fill="#7a4a04" opacity="0.6"/>
      <rect x="11" y="15" width="1.4" height="9" fill="#5d3a04" opacity="0.4"/>
      <rect x="20.6" y="15" width="1.4" height="9" fill="#5d3a04" opacity="0.4"/>
    </pattern>

    <linearGradient id="basketShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c0f04" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="basketSideShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.18"/>
      <stop offset="25%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c0f04" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a04"/>
      <stop offset="55%" stop-color="#3b1d09"/>
      <stop offset="100%" stop-color="#1c0f04"/>
    </linearGradient>

    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b1d09"/>
      <stop offset="50%" stop-color="#a76b1a"/>
      <stop offset="100%" stop-color="#3b1d09"/>
    </linearGradient>

    <radialGradient id="innerHole" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d0501"/>
      <stop offset="60%" stop-color="#1c0f04"/>
      <stop offset="100%" stop-color="#3b1d09"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="304" rx="158" ry="9" fill="#1c0f04" opacity="0.55"/>
  <ellipse cx="200" cy="306" rx="140" ry="5" fill="#1c0f04" opacity="0.4"/>

  <!-- LEFT HANDLE (back) -->
  <path d="M 96 130 C 96 22 138 22 138 130"
        fill="none" stroke="#1c0f04" stroke-width="18" stroke-linecap="round"/>
  <path d="M 99 128 C 99 28 135 28 135 128"
        fill="none" stroke="url(#handleGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- handle wrap rope binding (rings every 8px) -->
  <g stroke="#1c0f04" stroke-width="0.8" opacity="0.85">
    <path d="M 99 35 Q 117 32 135 35" fill="none"/>
    <path d="M 99 43 Q 117 40 135 43" fill="none"/>
    <path d="M 99 51 Q 117 48 135 51" fill="none"/>
    <path d="M 99 59 Q 117 56 135 59" fill="none"/>
    <path d="M 99 67 Q 117 64 135 67" fill="none"/>
    <path d="M 99 75 Q 117 72 135 75" fill="none"/>
    <path d="M 99 83 Q 117 80 135 83" fill="none"/>
    <path d="M 99 91 Q 117 88 135 91" fill="none"/>
    <path d="M 99 99 Q 117 96 135 99" fill="none"/>
    <path d="M 99 107 Q 117 104 135 107" fill="none"/>
    <path d="M 99 115 Q 117 112 135 115" fill="none"/>
  </g>
  <!-- handle highlight upper-left -->
  <path d="M 102 124 C 102 32 116 26 130 30"
        fill="none" stroke="#fde68a" stroke-width="1.4" opacity="0.45"/>
  <!-- handle attach point shadow -->
  <ellipse cx="98" cy="128" rx="6" ry="4" fill="#1c0f04" opacity="0.7"/>
  <ellipse cx="136" cy="128" rx="6" ry="4" fill="#1c0f04" opacity="0.7"/>

  <!-- RIGHT HANDLE -->
  <path d="M 262 130 C 262 22 304 22 304 130"
        fill="none" stroke="#1c0f04" stroke-width="18" stroke-linecap="round"/>
  <path d="M 265 128 C 265 28 301 28 301 128"
        fill="none" stroke="url(#handleGrad)" stroke-width="12" stroke-linecap="round"/>
  <g stroke="#1c0f04" stroke-width="0.8" opacity="0.85">
    <path d="M 265 35 Q 283 32 301 35" fill="none"/>
    <path d="M 265 43 Q 283 40 301 43" fill="none"/>
    <path d="M 265 51 Q 283 48 301 51" fill="none"/>
    <path d="M 265 59 Q 283 56 301 59" fill="none"/>
    <path d="M 265 67 Q 283 64 301 67" fill="none"/>
    <path d="M 265 75 Q 283 72 301 75" fill="none"/>
    <path d="M 265 83 Q 283 80 301 83" fill="none"/>
    <path d="M 265 91 Q 283 88 301 91" fill="none"/>
    <path d="M 265 99 Q 283 96 301 99" fill="none"/>
    <path d="M 265 107 Q 283 104 301 107" fill="none"/>
    <path d="M 265 115 Q 283 112 301 115" fill="none"/>
  </g>
  <path d="M 268 124 C 268 32 282 26 296 30"
        fill="none" stroke="#fde68a" stroke-width="1.4" opacity="0.45"/>
  <ellipse cx="264" cy="128" rx="6" ry="4" fill="#1c0f04" opacity="0.7"/>
  <ellipse cx="302" cy="128" rx="6" ry="4" fill="#1c0f04" opacity="0.7"/>

  <!-- BASKET BODY (subtle trapezoidal — slightly wider at top) -->
  <path d="M 60 290
           Q 50 290 48 280
           L 30 144
           Q 30 134 42 130
           L 358 130
           Q 370 134 370 144
           L 352 280
           Q 350 290 340 290 Z"
        fill="url(#bambooWeave)"
        stroke="#1c0f04" stroke-width="2.2"/>

  <!-- side shading overlay -->
  <path d="M 60 290
           Q 50 290 48 280
           L 30 144
           Q 30 134 42 130
           L 358 130
           Q 370 134 370 144
           L 352 280
           Q 350 290 340 290 Z"
        fill="url(#basketSideShade)"/>

  <!-- vertical light/shadow body shading -->
  <path d="M 60 290
           Q 50 290 48 280
           L 30 144
           Q 30 134 42 130
           L 358 130
           Q 370 134 370 144
           L 352 280
           Q 350 290 340 290 Z"
        fill="url(#basketShade)"/>

  <!-- horizontal "weft band" decorative lines for added detail -->
  <g opacity="0.45">
    <path d="M 32 168 L 368 168" stroke="#1c0f04" stroke-width="1.8" fill="none"/>
    <path d="M 32 169 L 368 169" stroke="#fde68a" stroke-width="0.4" opacity="0.5" fill="none"/>
    <path d="M 32 215 L 368 215" stroke="#1c0f04" stroke-width="1.8" fill="none"/>
    <path d="M 32 216 L 368 216" stroke="#fde68a" stroke-width="0.4" opacity="0.5" fill="none"/>
    <path d="M 32 262 L 368 262" stroke="#1c0f04" stroke-width="1.8" fill="none"/>
    <path d="M 32 263 L 368 263" stroke="#fde68a" stroke-width="0.4" opacity="0.5" fill="none"/>
  </g>

  <!-- bottom thick rim band -->
  <path d="M 30 282
           L 370 282
           L 352 290
           Q 350 292 340 292
           L 60 292
           Q 50 292 48 290 Z"
        fill="#1c0f04"/>
  <path d="M 36 282 L 364 282" stroke="#7a4a04" stroke-width="1" opacity="0.6"/>

  <!-- TOP RIM (rolled bamboo edge - 3 layered ellipses for depth) -->
  <ellipse cx="200" cy="138" rx="172" ry="14" fill="#1c0f04"/>
  <ellipse cx="200" cy="135" rx="170" ry="12" fill="url(#rimGrad)"/>
  <ellipse cx="200" cy="132" rx="167" ry="10" fill="#3b1d09"/>
  <!-- rim outer top highlight -->
  <path d="M 30 130 Q 200 122 370 130"
        fill="none" stroke="#a76b1a" stroke-width="1.6" opacity="0.75"/>
  <!-- rim subtle band -->
  <path d="M 33 134 Q 200 126 367 134"
        fill="none" stroke="#fde68a" stroke-width="0.6" opacity="0.5"/>

  <!-- inner basket darkness (the hole) -->
  <ellipse cx="200" cy="134" rx="163" ry="8.5" fill="url(#innerHole)"/>
  <ellipse cx="200" cy="135" rx="158" ry="6.5" fill="#0d0501"/>

  <!-- light reflection spots on rim -->
  <ellipse cx="105" cy="129" rx="22" ry="2.4" fill="#fde68a" opacity="0.4"/>
  <ellipse cx="285" cy="129" rx="20" ry="2" fill="#fde68a" opacity="0.3"/>
  <ellipse cx="200" cy="128" rx="14" ry="1.5" fill="#fde68a" opacity="0.25"/>

  <!-- subtle wear/damage marks (texture) -->
  <g opacity="0.35">
    <ellipse cx="80" cy="200" rx="3" ry="1.5" fill="#1c0f04"/>
    <ellipse cx="320" cy="240" rx="3" ry="1.5" fill="#1c0f04"/>
    <ellipse cx="180" cy="260" rx="2.5" ry="1.2" fill="#1c0f04"/>
    <ellipse cx="280" cy="180" rx="2.5" ry="1.2" fill="#1c0f04"/>
  </g>

  <!-- subtle highlights (light catching weave) -->
  <g opacity="0.18">
    <ellipse cx="120" cy="180" rx="20" ry="3" fill="#fde68a"/>
    <ellipse cx="80" cy="220" rx="14" ry="2.5" fill="#fde68a"/>
  </g>
</svg>
