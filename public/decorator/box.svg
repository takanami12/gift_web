<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Hộp quà">
  <defs>
    <linearGradient id="boxBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#9c7409"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c89211"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
  </defs>

  <!-- box body -->
  <rect x="10" y="55" width="100" height="60" rx="5" ry="5" fill="url(#boxBody)" stroke="#5d4308" stroke-width="1.5"/>
  <!-- lid -->
  <rect x="6" y="46" width="108" height="14" rx="3" ry="3" fill="url(#boxLid)" stroke="#5d4308" stroke-width="1.5"/>

  <!-- vertical ribbon -->
  <rect x="55" y="46" width="10" height="69" fill="#f8f5e8" stroke="#a89a4d" stroke-width="0.7"/>
  <!-- horizontal ribbon -->
  <rect x="10" y="78" width="100" height="8" fill="#f8f5e8" stroke="#a89a4d" stroke-width="0.7"/>

  <!-- bow loops -->
  <ellipse cx="46" cy="42" rx="16" ry="10" fill="#c1121f" stroke="#7a0613" stroke-width="1.5"/>
  <ellipse cx="74" cy="42" rx="16" ry="10" fill="#c1121f" stroke="#7a0613" stroke-width="1.5"/>
  <ellipse cx="46" cy="42" rx="6" ry="4" fill="#7a0613" opacity="0.55"/>
  <ellipse cx="74" cy="42" rx="6" ry="4" fill="#7a0613" opacity="0.55"/>
  <!-- bow knot -->
  <rect x="54" y="36" width="12" height="14" rx="2" ry="2" fill="#7a0613"/>

  <!-- streamers -->
  <path d="M52 50 L46 64 L56 56 Z" fill="#c1121f" stroke="#7a0613" stroke-width="1"/>
  <path d="M68 50 L74 64 L64 56 Z" fill="#c1121f" stroke="#7a0613" stroke-width="1"/>
</svg>
